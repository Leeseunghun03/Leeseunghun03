<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" role="img" aria-labelledby="title">
  <title id="title">LinkedIn</title>
  <style>
    .frame { stroke: #cbd5df; }
    .label, .mark { fill: #52637a; }
    .inverse { fill: white; }
    @media (prefers-color-scheme: dark) {
      .frame { stroke: #364350; }
      .label, .mark { fill: #b4c0cf; }
      .inverse { fill: #0d1117; }
    }
  </style>
  <rect class="frame" x=".5" y=".5" width="35" height="35" rx="7" fill="none"/>
  <rect class="mark" x="10" y="10" width="16" height="16" rx="2"/>
  <text class="inverse" x="18" y="22.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700">in</text>
</svg>
